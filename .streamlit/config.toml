[theme]
base = "light"
primaryColor = "#0C6B60"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#EDF2F7"
textColor = "#13283B"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#EDF2F7"
secondaryBackgroundColor = "#FFFFFF"

[server]
maxUploadSize = 6
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
