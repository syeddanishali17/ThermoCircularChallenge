[theme]
base = "light"
primaryColor = "#1A5D4F"
backgroundColor = "#F8F7F3"
secondaryBackgroundColor = "#EEEEE8"
textColor = "#1D2C29"
font = "sans-serif"
baseFontSize = 16
linkColor = "#285E91"
borderColor = "#D7DBD3"
dataframeHeaderBackgroundColor = "#EEEEE8"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#EEEEE8"
secondaryBackgroundColor = "#FFFFFF"

[server]
maxUploadSize = 6
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
