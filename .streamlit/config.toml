[theme]
base = "light"
primaryColor = "#08756A"
backgroundColor = "#F7FAFC"
secondaryBackgroundColor = "#ECF2F7"
textColor = "#152B3D"
font = "sans-serif"
baseFontSize = 16
linkColor = "#2E62A1"
borderColor = "#CDDBE5"
dataframeHeaderBackgroundColor = "#EAF1F6"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#ECF2F7"
secondaryBackgroundColor = "#FFFFFF"

[server]
maxUploadSize = 6
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
