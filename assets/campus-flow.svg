<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 225" role="img">
  <title>Conceptual ThermoCircular data centre</title>
  <desc>Electricity flows from the grid to the server hall. Warm liquid flows to the heat pump. The heat pump feeds the district heating network.</desc>
  <defs>
    <linearGradient id="rack" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#2a4561"/><stop offset="1" stop-color="#132b42"/>
    </linearGradient>
    <linearGradient id="pad" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#20394f"/><stop offset="1" stop-color="#142b40"/>
    </linearGradient>
    <g id="server">
      <path d="m0 0 12-8 32 0-12 8Z" fill="#395a76"/>
      <path d="M32 0 44-8v66l-12 8Z" fill="#14283c" stroke="#3f6380"/>
      <rect width="32" height="66" rx="2" fill="url(#rack)" stroke="#4f7893"/>
      <path d="M5 11h22M5 22h22M5 33h22M5 44h22M5 55h22" stroke="#7596ac" stroke-opacity=".55"/>
      <g fill="#79ebc5"><circle cx="7" cy="8" r="1.4"/><circle cx="7" cy="19" r="1.4"/><circle cx="7" cy="30" r="1.4"/><circle cx="7" cy="41" r="1.4"/><circle cx="7" cy="52" r="1.4"/></g>
    </g>
  </defs>
  <style>
    .pulse { stroke-dasharray: 5 25; animation: flow 1.9s linear infinite; }
    .thermal { animation-duration: 2.4s; }
    .return { animation-direction: reverse; animation-duration: 3.1s; }
    @keyframes flow { to { stroke-dashoffset: -60; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <path d="M19 133 142 66h375l-8 62-124 68H38Z" fill="url(#pad)" stroke="#31526b"/>
